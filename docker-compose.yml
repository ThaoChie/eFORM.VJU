services:
  postgres:
    image: postgres:16-alpine
    container_name: edrl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      POSTGRES_DB: edrl_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME} -d edrl_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: edrl-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc
    container_name: edrl-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY};
      /usr/bin/mc mb -p myminio/${MINIO_BUCKET_PROOFS};
      /usr/bin/mc mb -p myminio/${MINIO_BUCKET_SIGNATURES};
      /usr/bin/mc mb -p myminio/${MINIO_BUCKET_SIGNED_PDFS};
      /usr/bin/mc anonymous set public myminio/${MINIO_BUCKET_PROOFS};
      /usr/bin/mc anonymous set public myminio/${MINIO_BUCKET_SIGNATURES};
      /usr/bin/mc anonymous set public myminio/${MINIO_BUCKET_SIGNED_PDFS};
      exit 0;
      "
volumes:
  postgres_data:
  minio_data:
