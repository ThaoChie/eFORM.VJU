spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/edrl_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password123}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

jwt:
  secret: ${JWT_SECRET:super_secret_jwt_key_drl_eform_2026_super_secret_jwt_key_drl_eform_2026}
  expirationMs: ${JWT_EXPIRATION_MS:28800000}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}
  buckets:
    proofs: ${MINIO_BUCKET_PROOFS:proofs}
    signatures: ${MINIO_BUCKET_SIGNATURES:signatures}
    signedPdfs: ${MINIO_BUCKET_SIGNED_PDFS:signed-pdfs}

render-service:
  url: ${RENDER_SERVICE_URL:http://localhost:8000/render}
  timeoutMs: ${RENDER_TIMEOUT_MS:30000}

pades:
  keystore:
    base64: ${KEYSTORE_BASE64:}
    password: ${KEYSTORE_PASSWORD:vju_drl_secure_key_2026}
  signer:
    name: ${PADES_SIGNER_NAME:Trường Đại học Việt Nhật (VJU) - ĐHQGHN}
    reason: ${PADES_SIGNER_REASON:Chứng thực số Bảng Điểm Rèn Luyện Sinh Viên (E-Form VJU)}
    location: ${PADES_SIGNER_LOCATION:Hà Nội, Việt Nam}
