server:
  port: ${PORT:8080}
  tomcat:
    max-http-form-post-size: 35MB
    max-swallow-size: 35MB
spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 30MB
      max-request-size: 35MB
  main:
    lazy-initialization: false
    allow-bean-definition-overriding: true
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
      connection-timeout: 60000
      max-lifetime: 240000
      idle-timeout: 120000
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    clean-disabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
python:
  parser:
    url: ${RENDER_SERVICE_URL:http://localhost:8000/render}

brevo:
  api-key: ${BREVO_API_KEY:}
  sender-email: ${BREVO_SENDER_EMAIL:${SPRING_MAIL_FROM:no-reply@vju.ac.vn}}
  sender-name: ${BREVO_SENDER_NAME:Trường Đại học Việt Nhật (VJU) - Hệ thống ĐRL}
  api-url: ${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
  app-base-url: ${APP_BASE_URL:${PUBLIC_BASE_URL:https://e-form-vju-staging.vercel.app}}
  enabled: ${BREVO_ENABLED:true}
