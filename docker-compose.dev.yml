# ====================================================================
# Docker Compose Override cho Môi trường Phát triển (Development Mode)
# Kích hoạt Hot-Reloading & Live-Sync mã nguồn cho cả Backend và Frontend
# ====================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    environment:
      NODE_ENV: development
    volumes:
      - ./backend:/app
      - /app/node_modules
      - upload_data:/app/uploads
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    environment:
      NODE_ENV: development
      VITE_API_BASE_URL: http://localhost:5000/api/v1
    ports:
      - "${HOST_PORT_FRONTEND:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 3000
